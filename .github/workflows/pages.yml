# Deploy the public landing (public/studio.html + assets) to GitHub Pages.
# Live URL after first run: https://<user>.github.io/<repo>/
#
# To enable:
#   1. GitHub repo → Settings → Pages → Source = "GitHub Actions"
#   2. Push to main (or trigger manually).
#
# We deploy ONLY the marketing surface — operator.* never gets shipped here.

name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/studio.html'
      - 'public/assets/**'
      - 'public/brand/**'
      - 'public/favicon.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public-only artefact
        run: |
          mkdir -p _site
          cp public/studio.html _site/index.html
          cp public/studio.html _site/studio.html
          [ -f public/favicon.ico ] && cp public/favicon.ico _site/ || true
          [ -d public/assets ]      && cp -r public/assets _site/ || true
          [ -d public/brand ]       && cp -r public/brand  _site/ || true
          # 404 fallback so any unknown path lands on the marketing page
          cp public/studio.html _site/404.html
          # tiny meta robots boost
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
