  #fallback a{color:#e9b44c;text-decoration:none;border-bottom:1px solid #e9b44c}
  #bar{position:fixed;top:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid #1f1f1f;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;z-index:20;font-size:12px}
  #bar .brand{font-family:Impact,'Anton',sans-serif;font-size:18px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  #bar .brand::before{content:'';width:8px;height:8px;background:#e9b44c;border-radius:50%;animation:pulse 2s infinite}
  #bar a{color:#f5f2ec;background:#e9b44c;color:#0a0a0a;padding:8px 18px;border-radius:100px;font-weight:600;text-decoration:none;font-size:12px;transition:background .3s}
