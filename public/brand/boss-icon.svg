<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#7be800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.85"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#c8ff00" stroke-width="2" opacity="0.4" stroke-dasharray="4 6"/>
  <text x="128" y="150" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="86"
        text-anchor="middle" fill="#c8ff00" filter="url(#glow)" letter-spacing="-2">B</text>
  <text x="128" y="200" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14"
        text-anchor="middle" fill="#c8ff00" letter-spacing="6" opacity="0.85">B·O·S·S</text>
</svg>
